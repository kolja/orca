[package]
name = "orca"
version = "0.1.21"
edition = "2021"
repository = "https://github.com/kolja/orca"

[dependencies]
tokio = "1.49"
actix-web = { version = "4.12", features = ["rustls-0_23"]}
actix-files = "0.6"
base64 = "0.23"
toml = "1.1.3"
serde = "1.0.228"
serde_json = "1.0"
serde_derive = "1.0.228"
lazy_static = "1.5.0"
tera = { version = "2.1.0", features = ["fast"] }
rusqlite = { version = "0.40", features = ["bundled"] }
html2text = "0.17"
dirs = "6.0"
clap = {version = "*", features = ["derive"]}
rand = "0.10"
regex = "1.12.3"
rust-embed = { version = "8.11.0", features = ["include-exclude"] }
once_cell = "1.21"
rustls = "0.23.36"
rustls-pemfile = "2.2"
anyhow = "1.0.101"
argon2 = { version = "0.5.3", features = ["std"] }
isolang = { version = "2.4.0", default-features = false }

[target.'cfg(unix)'.dependencies]
openssl = { version = "0.10.75", features = ["vendored"] }

[dev-dependencies]
assert_cmd = "2.1"
reqwest = { version = "0.13", features = ["json", "blocking"] }
tokio = { version = "1.49", features = ["full"] }
quick-xml = "0.41"
actix-http = "3.11"
tempfile = "3.24"

[lib]
name = "orca"
path = "src/lib.rs"
