[tasks.coverage-check]
description = "Run tests under tarpaulin; fail if any file lost coverage"
script = [
  "./scripts/coverage.sh ${@}"
]

[tasks.docker-build]
description = "Build and push the Docker image, and the demo image on top of it"
script = [
  "./docker/docker-build.sh ${@} && ./docker/demo-build.sh ${@}"
]

# Only needed when the demo changes on its own:
# docker-build will also buid and push the demo
[tasks.docker-build-demo]
description = "Build and push just the demo image"
script = [
  "./docker/demo-build.sh ${@}"
]

[tasks.docker-run]
description = "Run Docker container"
script = [
  "./docker/run.sh"
]

[tasks.git-tag]
description = "Create a new Git tag"
script = [
  "./docker/git-tag.sh"
]

[tasks.list-sha]
description = "list sha-sum for all Assets in Release"
script = [
  "./docker/list-sha.sh"
]

