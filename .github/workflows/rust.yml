name: Release

permissions:
  contents: write

on:
  push:
    tags:
      - v[0-9]+.*
    branches:
      - main
  workflow_dispatch:

jobs:
  run-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev

      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin

      - name: Run cargo test
        run: cargo test --all --release

      - name: Test coverage
        run: cargo tarpaulin --out Xml --output-dir ./coverage

      - name: Coveralls GitHub Action
        uses: coverallsapp/github-action@v2.3.4

  create-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: run-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/create-gh-release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  upload-assets:
    if: startsWith(github.ref, 'refs/tags/')
    needs: create-release
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          # Linux ARM64, for Raspberry Pi and ARM-based NAS users. Also the
          # binary baked into the linux/arm64 Docker image by docker/Dockerfile.
          # Built on a native ARM runner rather than cross-compiled, because
          # rusqlite (bundled) and openssl (vendored) both compile C sources.
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: orca
          target: ${{ matrix.target }}
          token: ${{ secrets.GITHUB_TOKEN }}
